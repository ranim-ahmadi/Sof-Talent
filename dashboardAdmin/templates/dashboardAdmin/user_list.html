 <form method="get" action="{% url 'admin_dashboard' %}">
    <label for="role">Filtrer par rôle :</label>
    <select name="role" id="role">
        <option value="">-- Tous les rôles --</option>
        <option value="manager" {% if request.GET.role == 'manager' %}selected{% endif %}>Manager</option>
        <option value="employee" {% if request.GET.role == 'employee' %}selected{% endif %}>Employee</option>
    </select>
    <button type="submit">Filtrer</button>
</form>

<table>
    <thead>
        <tr>
            <th>Nom</th>
            <th>Email</th>
            <th>Rôle</th>
            <th>Matricule</th>
        </tr>
    </thead>
    <tbody>
        {% for user in users %}
        <tr>
            <td>{{ user.username }}</td>
            <td>{{ user.matricule }}</td>
            <td>{{ user.email }}</td>
            <td>{{ user.get_role_display }}</td>
        </tr>
        {% empty %}
        <tr>
            <td colspan="3">Aucun utilisateur trouvé.</td>
        </tr>
        {% endfor %}
    </tbody>
</table>
