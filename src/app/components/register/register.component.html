<div class="register-container">
  <div class="register-card">
    <!-- Logo et titre -->
    <div class="text-center mb-3">
      <img src="assets/logo.png" alt="logo" style="max-width: 180px;">
    </div>

    <form (ngSubmit)="onRegister()">
      <div class="row">
        <div class="form-group col-md-6">
          <label for="username">Nom d'utilisateur</label>
          <input type="text" id="username" class="form-control" [(ngModel)]="user.username" name="username" required>
        </div>

        <div class="form-group col-md-6">
          <label for="matricule">Matricule</label>
          <input type="text" id="matricule" class="form-control" [(ngModel)]="user.matricule" name="matricule" required>
        </div>

        <div class="form-group col-md-12">
          <label for="email">Email</label>
          <input type="email" id="email" class="form-control" [(ngModel)]="user.email" name="email" required>
        </div>

        <div class="form-group col-md-6">
          <label for="password">Mot de passe</label>
          <input type="password" id="password" class="form-control" [(ngModel)]="user.password" name="password" required>
        </div>

        <div class="form-group col-md-6">
          <label for="password2">Confirmer le mot de passe</label>
          <input type="password" id="password2" class="form-control" [(ngModel)]="user.password2" name="password2" required>
        </div>
      </div>

      <!-- Bouton centré -->
      <div class="form-group text-center mt-3">
        <button type="submit" class="btn btn-orange">S'inscrire</button>
      </div>

      <!-- Lien vers login -->
      <div class="text-center mt-3">
        <p class="signup-text">Vous avez déjà un compte ? 
          <a [routerLink]="['/login']" class="text-orange">Connexion</a>
        </p>
      </div>
    </form>
  </div>
</div>
